        - paragraph [ref=f59e26]: What changes when search becomes part of the architecture instead of a feature added at the end.
        - paragraph [ref=f59e27]: A search box looks small in a product brief, but the moment people rely on it, it becomes a contract between data, ranking, latency, and the user interface.
        - paragraph [ref=f59e28]: The useful work starts before the first query. Decide what a document means, which fields deserve weight, how stale data can be, and what the system should do when no result is a good result.
        - paragraph [ref=f59e29]: Thinking about those questions as system boundaries makes the implementation calmer. Indexing, querying, and observing the search path become separate jobs with visible failure modes.
