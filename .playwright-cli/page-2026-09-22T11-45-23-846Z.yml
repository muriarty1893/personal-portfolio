        - paragraph [ref=f61e27]: A practical checklist for deciding when a small service is clearer than another layer in a larger application.
        - paragraph [ref=f61e28]: A service should earn its process boundary. If it does not own a clear responsibility, its own data, or a useful deployment rhythm, it may only be adding ceremony.
        - paragraph [ref=f61e29]: "When the boundary is real, Go makes the boring parts pleasant: a small binary, explicit dependencies, straightforward concurrency, and a standard library that keeps the surface area readable."
        - paragraph [ref=f61e30]: The goal is not more services. The goal is fewer places where a future change has to be explained twice.
