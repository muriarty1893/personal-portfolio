      - generic [ref=f57e64]:
        - paragraph [ref=f57e65]: What changes when search becomes part of the architecture instead of a feature added at the end.
        - paragraph [ref=f57e66]: A search box looks small in a product brief, but the moment people rely on it, it becomes a contract between data, ranking, latency, and the user interface.
        - paragraph [ref=f57e67]: The useful work starts before the first query. Decide what a document means, which fields deserve weight, how stale data can be, and what the system should do when no result is a good result.
        - paragraph [ref=f57e68]: Thinking about those questions as system boundaries makes the implementation calmer. Indexing, querying, and observing the search path become separate jobs with visible failure modes.
