<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Murat Eker</title>
    <meta name="description" content="The page you requested could not be found. Return to Murat Eker's portfolio." />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Spline+Sans+Mono:wght@400;600&display=swap" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f5f5f5;
        color: #111;
        font-family: Poppins, sans-serif;
      }
      main { width: min(100%, 760px); }
      .eyebrow {
        margin: 0 0 24px;
        font-family: 'Spline Sans Mono', monospace;
        font-size: 12px;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(56px, 12vw, 148px);
        line-height: .84;
        letter-spacing: -.08em;
        text-transform: uppercase;
      }
      p {
        max-width: 480px;
        margin: 32px 0;
        color: #555;
        font-size: 16px;
        line-height: 1.7;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 12px 18px;
        border: 1px solid #111;
        color: #111;
        font-family: 'Spline Sans Mono', monospace;
        font-size: 11px;
        letter-spacing: .1em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:first-child { background: #111; color: #fff; }
      a:hover, a:focus-visible { background: #333; color: #fff; }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <p class="eyebrow">404 / Lost in the system</p>
      <h1 id="page-title">Page not found.</h1>
      <p>The link may be outdated or the page may have moved. Let’s get you back to the portfolio.</p>
      <div class="actions">
        <a href="/">Back to portfolio&nbsp; ↗</a>
        <a href="mailto:ekermuratinfo@gmail.com">Email me&nbsp; ↗</a>
      </div>
    </main>
  </body>
</html>
